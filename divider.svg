<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" preserveAspectRatio="none">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#e6fbff"/>
      <stop offset="0.4" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="5" width="1200" height="2" fill="url(#line)"/>
  <path d="M600 0L606 6L600 12L594 6Z" fill="#04070d" stroke="#00e5ff" stroke-width="1.5"/>
  <circle cy="6" r="6" fill="url(#pulse)">
