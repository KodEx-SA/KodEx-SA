<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070d"/>
      <stop offset="0.6" stop-color="#071a24"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00e5ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0ffff"/>
      <stop offset="0.35" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M12 40V12H40"/><path d="M1160 12H1188V40"/>
    <path d="M12 240V268H40"/><path d="M1160 268H1188V240"/>
  </g>

  <!-- arc reactor -->
  <g transform="translate(190 140)">
    <circle r="95" fill="url(#core)" opacity="0.18"/>
    <g fill="none" stroke="#00e5ff">
      <circle r="88" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="70" stroke-width="3" stroke-dasharray="60 20 10 20" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="52" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="36" stroke-width="2" opacity="0.9"/>
    </g>
    <g fill="#00e5ff" opacity="0.85">
      <rect x="-3" y="-34" width="6" height="14"/><rect x="-3" y="20" width="6" height="14"/>
      <rect x="-34" y="-3" width="14" height="6"/><rect x="20" y="-3" width="14" height="6"/>
    </g>
    <circle r="16" fill="url(#core)">
      <animate attributeName="r" values="14;19;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text block -->
  <g font-family="'Courier New', Courier, monospace">
    <text x="360" y="88" fill="#00e5ff" font-size="15" letter-spacing="4" opacity="0.8">// OPERATOR PROFILE</text>
    <text x="360" y="150" fill="#e6fbff" font-size="58" font-weight="bold" letter-spacing="3">ASHLEY K MOTSIE</text>
    <text x="360" y="186" fill="#00e5ff" font-size="20" letter-spacing="3">SOFTWARE DEVELOPER  //  AI ENGINEER</text>
    <text x="360" y="222" fill="#7fb8c4" font-size="14" letter-spacing="2">KodEx-SA  ::  RUSTENBURG, ZA  ::  SAST (UTC+2)</text>
  </g>

  <!-- status indicator -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#00ff9c">
    <circle cx="1010" cy="46" r="5" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1024" y="51" letter-spacing="2">SYSTEM ONLINE</text>
  </g>

  <!-- scanning line -->
  <rect x="0" y="-40" width="1200" height="40" fill="url(#scan)">
    <animate attributeName="y" values="-40;280" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
