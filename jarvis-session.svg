<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 266" width="780" height="266" role="img" aria-label="Illustrative Jarvis session: a voice command is planned, run through calendar and reminder tools, and answered">
  <title>Jarvis - sample session (illustrative)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070d"/><stop offset="1" stop-color="#071a24"/></linearGradient>
    <clipPath id="c0"><rect x="24" y="43" height="22" width="0"><animate attributeName="width" values="0;0;403;403;0" keyTimes="0;0.0250;0.1050;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c1"><rect x="24" y="69" height="22" width="0"><animate attributeName="width" values="0;0;357;357;0" keyTimes="0;0.1200;0.1800;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="24" y="95" height="22" width="0"><animate attributeName="width" values="0;0;559;559;0" keyTimes="0;0.2000;0.3100;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c3"><rect x="24" y="121" height="22" width="0"><animate attributeName="width" values="0;0;333;333;0" keyTimes="0;0.3450;0.4050;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c4"><rect x="24" y="147" height="22" width="0"><animate attributeName="width" values="0;0;513;513;0" keyTimes="0;0.4300;0.5050;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c5"><rect x="24" y="173" height="22" width="0"><animate attributeName="width" values="0;0;466;466;0" keyTimes="0;0.5250;0.6000;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c6"><rect x="24" y="199" height="22" width="0"><animate attributeName="width" values="0;0;606;606;0" keyTimes="0;0.6300;0.7500;0.95;1" dur="20.0s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="779" height="265" rx="6" fill="url(#bg)" stroke="#00e5ff" stroke-opacity="0.4"/>
  <rect x="0.5" y="0.5" width="779" height="30" rx="6" fill="#00e5ff" fill-opacity="0.08"/>
  <circle cx="18" cy="15" r="4" fill="#f7768e"/><circle cx="33" cy="15" r="4" fill="#ffb86c"/><circle cx="48" cy="15" r="4" fill="#00ff9c"/>
  <g font-family="'Courier New', Courier, monospace">
    <text x="390.0" y="19" text-anchor="middle" font-size="12" fill="#7fb8c4" letter-spacing="2">JARVIS // SAMPLE SESSION</text>
    <text x="764" y="19" text-anchor="end" font-size="11" fill="#ffb86c">illustrative</text>
    <g font-size="13"><text x="24" y="58" fill="#e6fbff" clip-path="url(#c0)" xml:space="preserve">$ jarvis --mode=agent --llm=claude --fallback=local</text><text x="24" y="84" fill="#00e5ff" clip-path="url(#c1)" xml:space="preserve">[SYS   ]  online · voice ready · tools loaded</text><text x="24" y="110" fill="#bfefff" clip-path="url(#c2)" xml:space="preserve">[VOICE ]  "check my calendar for tomorrow and remind me an hour before"</text><text x="24" y="136" fill="#ffb86c" clip-path="url(#c3)" xml:space="preserve">[PLAN  ]  calendar.read -&gt; reminder.create</text><text x="24" y="162" fill="#00e5ff" clip-path="url(#c4)" xml:space="preserve">[TOOL  ]  calendar.read(day="tomorrow") ................ 3 events</text><text x="24" y="188" fill="#00e5ff" clip-path="url(#c5)" xml:space="preserve">[TOOL  ]  reminder.create(offset="-60m") ............... OK</text><text x="24" y="214" fill="#00ff9c" clip-path="url(#c6)" xml:space="preserve">[JARVIS]  "Three events tomorrow. Reminder set for an hour before the first."</text></g>
  </g>
  <rect x="632" y="202" width="8" height="15" fill="#00ff9c">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;0;8;8;0" keyTimes="0;0.7500;0.7510;0.95;1" dur="20.0s" repeatCount="indefinite"/>
  </rect>
</svg>